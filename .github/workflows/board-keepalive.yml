name: Keep the board awake

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours; Supabase wants a few requests a day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/site.json
          sparse-checkout-cone-mode: false
      - name: Read from the board
        run: |
          URL=$(jq -r .board.url data/site.json)
          KEY=$(jq -r .board.key data/site.json)
          for i in 1 2 3; do
            curl -fsS "$URL/rest/v1/board_items?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
            sleep 5
          done
          echo "Board answered."
