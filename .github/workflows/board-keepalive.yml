name: Keep the board awake

on:
  schedule:
    - cron: '17 15 */3 * *'   # every third day, 8:17 AM Phoenix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/site.json
          sparse-checkout-cone-mode: false
      - name: Read one row from the board
        run: |
          URL=$(jq -r .board.url data/site.json)
          KEY=$(jq -r .board.key data/site.json)
          curl -fsS "$URL/rest/v1/board_items?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Board answered."
